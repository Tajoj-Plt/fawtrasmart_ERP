<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار API الموظفين</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .result {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            direction: ltr;
        }
        button {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>اختبار API الموظفين</h1>
    <p>هذه الصفحة لاختبار ما إذا كان API الموظفين يعمل بشكل صحيح</p>
    
    <button onclick="testEmployeesAPI()">اختبار API الموظفين</button>
    
    <div id="result" class="result" style="display:none;">
        <h3>النتيجة:</h3>
        <pre id="json-result"></pre>
    </div>

    <script>
        async function testEmployeesAPI() {
            const resultDiv = document.getElementById('result');
            const jsonResult = document.getElementById('json-result');
            
            resultDiv.style.display = 'block';
            jsonResult.textContent = 'جاري التحميل...';
            
            try {
                const response = await fetch('/ar/clients/invoice-transfers/employees', {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    credentials: 'same-origin'
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                const data = await response.json();
                
                jsonResult.textContent = JSON.stringify(data, null, 2);
                
                if (data.success) {
                    const successMsg = document.createElement('div');
                    successMsg.className = 'success';
                    successMsg.textContent = 'تم تحميل ' + data.count + ' موظف بنجاح!';
                    resultDiv.insertBefore(successMsg, jsonResult);
                } else {
                    const errorMsg = document.createElement('div');
                    errorMsg.className = 'error';
                    errorMsg.textContent = 'حدث خطأ في تحميل الموظفين';
                    resultDiv.insertBefore(errorMsg, jsonResult);
                }
                
            } catch (error) {
                console.error('Error:', error);
                const errorMsg = document.createElement('div');
                errorMsg.className = 'error';
                errorMsg.textContent = 'خطأ: ' + error.message;
                resultDiv.insertBefore(errorMsg, jsonResult);
                jsonResult.textContent = 'Error: ' + error.toString();
            }
        }
    </script>
</body>
</html>
