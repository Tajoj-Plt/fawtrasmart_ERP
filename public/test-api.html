<!-- ملف اختبار مباشر -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>اختبار API ورقة الجرد</title>
</head>
<body style="direction: rtl; font-family: Arial;">
    <h1>🧪 اختبار API ورقة الجرد</h1>
    
    <button onclick="testAPI()">🔵 اختبار الـ API الآن</button>
    <hr>
    
    <h2>نتائج الاختبار:</h2>
    <pre id="output" style="background: #f5f5f5; padding: 20px; border-radius: 5px; overflow-x: auto;"></pre>

    <script>
        async function testAPI() {
            const output = document.getElementById('output');
            output.textContent = '⏳ جاري التحميل...\n';
            
            try {
                // اختبر الـ route الصحيح
                const url = window.location.origin + '/stock/reports/inventory-sheet-ajax';
                console.log('🔗 URL:', url);
                output.textContent += `📍 الرابط: ${url}\n\n`;
                
                const response = await fetch(url, {
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                output.textContent += `📊 Status: ${response.status} ${response.statusText}\n`;
                
                if (!response.ok) {
                    output.textContent += `❌ خطأ HTTP: ${response.status}\n`;
                    const text = await response.text();
                    output.textContent += `\nالرد:\n${text.substring(0, 500)}\n`;
                    return;
                }
                
                const data = await response.json();
                
                output.textContent += `\n✅ نجح! البيانات المستلمة:\n\n`;
                output.textContent += `- success: ${data.success}\n`;
                output.textContent += `- عدد المنتجات: ${data.products ? data.products.length : 0}\n`;
                output.textContent += `- عدد الفئات: ${data.totals ? Object.keys(data.totals).length : 0}\n`;
                output.textContent += `\n📦 تفاصيل المنتجات:\n`;
                
                if (data.products && Array.isArray(data.products)) {
                    data.products.forEach((product, idx) => {
                        output.textContent += `\n[${idx}] ${product.group_name || product.name}\n`;
                        if (product.items) {
                            output.textContent += `    - عدد العناصر: ${product.items.length}\n`;
                        }
                    });
                }
                
                output.textContent += `\n\n📋 الـ JSON الكامل:\n${JSON.stringify(data, null, 2)}`;
                
            } catch (error) {
                output.textContent += `\n❌ خطأ: ${error.message}\n`;
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
